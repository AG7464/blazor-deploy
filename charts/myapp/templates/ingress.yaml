apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blazor-app
  namespace: blazor-ns
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: blazor-app-svc
                port:
                  number: {{ .Values.service.port }}  
